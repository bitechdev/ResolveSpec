services:
  postgres-test:
    image: postgres:15-alpine
    container_name: resolvespec-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resolvespec-test

  testserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.testserver
    container_name: resolvespec-testserver
    environment:
      RESOLVESPEC_DB_TRACE_ENABLED: "true"
      RESOLVESPEC_DB_TRACE_MIN_CALLS: "1"
      RESOLVESPEC_DB_TRACE_POOL_LOG: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - resolvespec-test

volumes:
  postgres-test-data:
    driver: local

networks:
  resolvespec-test:
    driver: bridge
